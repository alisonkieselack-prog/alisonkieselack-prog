
name: Generate Profile Banner

on:
  push:
    branches:
      - main
    paths:
      - 'generate.py'
      - 'assets/fonts/**'
      - '.github/workflows/generate-banner.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pillow

      - name: Generate banners
        run: python generate.py

      - name: Verify generated banners
        run: |
          echo "Checking generated images..."
          ls -lh assets/*.gif
          test -f assets/name-banner-day.gif
          test -f assets/name-banner-night.gif

      - name: Commit updated banners
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/name-banner-day.gif assets/name-banner-night.gif
          git diff --cached --quiet || (
            git commit -m "Update profile banners" &&
            git push
          )